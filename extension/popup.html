<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Patrol</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      width: 330px;
      background-color: #070b14;
      color: #f1f5f9;
      padding: 14px;
      font-size: 12px;
      letter-spacing: -0.01em;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 12px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }
    .brand-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .brand-tag {
      font-size: 9px;
      font-family: monospace;
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 1px 4px;
      border-radius: 3px;
    }
    .conn-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .conn-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 5px #10b981;
    }
    .conn-status.disconnected {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .conn-status.disconnected .conn-dot {
      background: #ef4444;
      box-shadow: 0 0 5px #ef4444;
    }
    .card {
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .platform-badge {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .platform-tiktok { background: #ff0050; color: #fff; }
    .platform-youtube { background: #ef4444; color: #fff; }
    .platform-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }
    .platform-x { background: #000; border: 1px solid #334155; color: #fff; }
    .platform-unknown { background: #334155; color: #cbd5e1; }
    .url-box {
      background: #070b14;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10.5px;
      color: #38bdf8;
      word-break: break-all;
      max-height: 44px;
      overflow-y: auto;
      line-height: 1.3;
    }
    .field-group {
      margin-top: 8px;
    }
    .field-label {
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 3px;
      display: block;
      font-weight: 500;
    }
    .input-text {
      width: 100%;
      background: #070b14;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      color: #f1f5f9;
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-text:focus {
      border-color: #0284c7;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.25);
    }
    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.1);
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result-card {
      display: none;
      background: rgba(6, 182, 212, 0.06);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .ticket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .ticket-badge {
      display: inline-block;
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      background: #070b14;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #0284c7;
    }
    .result-desc {
      font-size: 10.5px;
      color: #94a3b8;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: background 0.15s;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #38bdf8;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      font-size: 10px;
      color: #64748b;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🛡</div>
      <div class="brand-title">
        <span>CYBER PATROL</span>
        <span class="brand-tag">INTEL</span>
      </div>
    </div>
    <div id="conn-indicator" class="conn-status">
      <div class="conn-dot"></div>
      <span id="conn-text">Aktif</span>
    </div>
  </div>

  <div class="card">
    <div class="card-top">
      <span class="card-label">Target Konten</span>
      <span id="platform-badge" class="platform-badge platform-unknown">Mendeteksi...</span>
    </div>
    <div id="tab-url" class="url-box">Mendeteksi tab...</div>

    <div class="field-group">
      <label class="field-label" for="analyst-id">Petugas / Analis</label>
      <input type="text" id="analyst-id" class="input-text" value="Analyst-01" placeholder="Nama / ID Analis">
    </div>

    <div class="field-group">
      <label class="field-label" for="notes">Catatan (Opsional)</label>
      <input type="text" id="notes" class="input-text" placeholder="Keterangan awal...">
    </div>
  </div>

  <button id="btn-submit" class="btn-submit">
    <span id="btn-text">⚡ Triase Konten</span>
  </button>

  <div id="result-card" class="result-card">
    <div class="ticket-row">
      <span style="font-size:10px; color:#94a3b8; font-weight:600;">TIKET DITERBITKAN</span>
      <div id="result-ticket" class="ticket-badge">PS-XXXX</div>
    </div>
    <p id="result-desc" class="result-desc">
      Bukti digital dicatat dan antrean analisis AI telah dipicu.
    </p>
    <a id="link-dashboard" href="http://localhost:5173/#/contents" target="_blank" class="btn-secondary">
      Buka di Dashboard →
    </a>
  </div>

  <div class="footer">
    <span>Cyber Patrol Intel</span>
    <a href="http://localhost:5173/#/contents" target="_blank">Dashboard Web</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
