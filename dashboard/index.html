<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TILIK — Sistem Pemantauan & Analisis Konten Siber</title>
    <script>
      // FOUC Prevention: apply saved theme before first paint
      (function() {
        var t = localStorage.getItem('tilik_theme') || localStorage.getItem('cyber_patrol_theme') || 'dark';
        var d = document.documentElement;
        d.classList.remove('dark', 'light');
        d.classList.add(t);
        d.style.colorScheme = t;
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#080b11] text-slate-100 font-sans antialiased selection:bg-blue-600/30 selection:text-blue-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
